name: Test ASP.Net Core app - goro-v3

on:
  push:
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: windows-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.x'

      - name: Restore
        run: dotnet restore .\src\goro-webapp\goro-webapp.slnx

      - name: Build
        run: dotnet build .\src\goro-webapp\goro-webapp.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test .\src\goro-webapp\goro-webapp.slnx --configuration Release --no-build --verbosity normal
