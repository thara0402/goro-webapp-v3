name: 機能追加
description: AI 駆動開発で実装したい新機能や改善を依頼する
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        「孤独のグルメ」巡礼サイトに追加したい機能を記載してください。
        チャットから Issue を作成する場合も、AI エージェントが設計・実装・テストへ進みやすいように、目的・対象画面・受け入れ条件を具体化してください。

  - type: textarea
    id: summary
    attributes:
      label: 概要
      description: 追加したい機能や改善を 1〜3 文で説明してください。
      placeholder: 例）店舗詳細ページで、営業状態ごとに表示を分かりやすくしたい。
    validations:
      required: true

  - type: textarea
    id: user-value
    attributes:
      label: ユーザー価値・目的
      description: 誰が、どの場面で、何を達成できるようにしたいかを記載してください。
      placeholder: 例）訪問前のユーザーが、営業中・閉店・一時閉店をすぐ判断できるようにする。
    validations:
      required: true

  - type: dropdown
    id: target-area
    attributes:
      label: 対象領域
      description: 主に影響する画面または機能を選択してください。
      multiple: true
      options:
        - ホーム（シーズン・話別の店舗一覧）
        - 店舗詳細（店舗情報・Google Maps）
        - 近くの店舗を探す（Geocoding・近隣検索）
        - 店舗データ（design/gourmet.json・Cosmos DB）
        - 共通 UI・ナビゲーション
        - Azure / Application Insights / 運用
        - テスト・開発体験
    validations:
      required: true

  - type: textarea
    id: current-behavior
    attributes:
      label: 現在の動作・背景
      description: 現在の仕様や困っている点があれば記載してください。
      placeholder: 例）店舗詳細ページでは営業状態の文字列は表示されるが、視覚的な区別が弱い。
    validations:
      required: false

  - type: textarea
    id: desired-behavior
    attributes:
      label: 期待する動作
      description: 実装後にユーザーから見てどう動くべきかを具体的に記載してください。
      placeholder: 例）active は緑、closed は灰色、temporarilyClosed は黄色のバッジで表示する。
    validations:
      required: true

  - type: textarea
    id: data-impact
    attributes:
      label: データ・外部サービスへの影響
      description: 店舗データ、Cosmos DB、Google Maps / Geocoding API、Application Insights、Azure App Service への影響があれば記載してください。
      placeholder: |
        例）
        - gourmet.json の status 値を追加・変更する必要はない
        - Google Maps API の呼び出し仕様は変更しない
    validations:
      required: false

  - type: textarea
    id: acceptance-criteria
    attributes:
      label: 受け入れ条件
      description: 完了判定に使う具体的な条件をチェックリストで記載してください。
      placeholder: |
        - [ ] 店舗詳細ページで営業状態がバッジ表示される
        - [ ] active / closed / temporarilyClosed / unknown の全状態を表示できる
        - [ ] 既存の詳細ページ遷移と地図表示が維持される
    validations:
      required: true

  - type: textarea
    id: ai-instructions
    attributes:
      label: AI エージェントへの補足指示
      description: 実装方針、変更してほしくない範囲、優先したい設計方針があれば記載してください。
      placeholder: |
        例）
        - design/spec.md と design/architecture.md を確認してから実装する
        - Bootstrap 標準コンポーネントを優先する
        - 不要な新規依存関係は追加しない
    validations:
      required: false

  - type: textarea
    id: test-plan
    attributes:
      label: 検証観点
      description: 実行してほしいテストや手動確認観点を記載してください。
      placeholder: |
        例）
        - dotnet test src/goro-webapp/goro-webapp.slnx
        - Home/Details で各営業状態の表示を確認する
    validations:
      required: false
